<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 6</title>
<style>
table,
tr,
th,
td{
    border:2px double black;
    border-style: double;
    margin:auto;
}
table{
    width:600px;
    height:600px;
}
.header{
    background-color:red;
    text-align:center;
    height:30px;
}
.footer{
    background-color:blue;
    text-align:center;
    height:30px;
}
.link{
    background-color:pink;
    width:50px;
    vertical-align:middle;
    padding-left:8px;
}
.green{
    background-color:green;
    text-align:center;
}
.yellow{
    background-color:yellow;
    width:400px;
    height:450px;
}
.brown{
    background-color:brown;
    width:180px;
    height:180px;
}
.gray{
    background-color:gray;
    width:90px;
    height:90px;
    text-align:center;
    vertical-align:middle;
    font-size:22px;
}
</style>
</head>
<body>
<table>
    <tr>
        <td class="header" colspan="2">Header</td>
    </tr>
    <tr>
        <td class="link">
            link<br>
            link<br>
            link<br>
            link<br>
            link<br>
            link<br>
            link<br>
            link
        </td>
        <td class="green">
            <table class="yellow">
                <tr>
                    <td align="center">
                        <table class="brown">
                            <tr>
                                <td align="center">
                                    <table class="gray">
                                        <tr>
                                            <td class="gray">ABC</td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td class="footer" colspan="2">Footer</td>
    </tr>
</table>
</body>
</html>
