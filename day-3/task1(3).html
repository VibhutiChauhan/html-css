<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 1(3)</title>
</head>
<style>
    table,
    th,
    tr,
    td{
        border-collapse: separate;
        border: 5px solid green;
        margin-left: auto;
        margin-right: auto;
        color: black;
        text-align: center;
        padding: 12px;
    }
    table{
        width: 15%;
        height: 50%;
    }
    .bt{
        border-style: dotted;
        border-color: black;
    }
    .d{
        border-style: double;
        border-color: black;
    }
    .n1{
        border-style: inset;
        border-color: white;
    }
</style>
<body>
    <table>
        <tr>
            <td>1</td>
            <td>1</td>
            <td class="bt">1</td>
        </tr>
        <tr>
            <td class="bt">1</td>
            <td class="d">1</td>
            <td class="n1">1</td>
        </tr>
        <tr>
            <td>1</td>
            <td class="n1">1</td>
            <td style="border-color: white; border-style: outset;">1</td>
        </tr>
    </table>
</body>
</html>
