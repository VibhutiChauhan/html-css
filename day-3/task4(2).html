<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 4(2)</title>
</head>
<style>
table,
th,
tr,
td{
    border: 1px solid gray;
    margin-left: auto;
    margin-right: auto;
    border-style: double;
}
table{
    width: 500px;
    height: 500px;
}
.pink{
    background-color: pink;
}
.green{
    background-color: green;
}
.yellow{
    background-color: yellow;
}
.red{
    background-color: red;
}
.orange{
    background-color: orange;
}
</style>
<body>
    <table>
        <tr>
            <td class="pink" colspan="6"></td>
            <td class="green" rowspan="6"></td>
        </tr>
        <tr>
            <td class="green" rowspan="6"></td>
            <td class="yellow" colspan="4"></td>
            
            <td class="red" rowspan="4"></td>          
        </tr>
        <tr>
            <td class="red" rowspan="4"></td>
            <td class="green" colspan="2"></td> 
            <td class="orange" rowspan="2"></td>
        </tr>
        <tr>
            <td class="orange" rowspan="2"></td>
            <td></td>
        </tr>
        <tr>
            <td class="green" colspan="2"></td>
        </tr>
        <tr>
            <td class="yellow" colspan="4"></td>
        </tr>
        <tr>
            <td class="pink" colspan="6"></td>
        </tr>
    </table>
</body>
</html>
