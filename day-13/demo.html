<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image</title>
</head>
<style>
    #img1 {
        filter: contrast(50%);
    }

    #img2 {
        filter: contrast(80%);
    }

    #img3 {
        clip-path: circle(50% at left);
    }
</style>
</head>

<body>

    <h1>The contrast Function</h1>

    <img id="img1" src="../day-1/Lighthouse.jpg" alt="" width="300" height="300">

    <img id="img2" src="../day-1/Lighthouse.jpg" alt="" width="300" height="300">

    <img src="../day-1/Lighthouse.jpg" alt="" width="300" height="300">
    <br><br>

    <h1>The circle() Function</h1>
    <img id="img3" src="../day-1/Lighthouse.jpg" alt="" width="300" height="300">

</body>

</html>
