<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task</title>
    <link rel="stylesheet" href="boot.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <form class="row g-3">
        <div class="col-12">
            <label for="inputAddress2" class="form-label">First name</label>
            <input type="text" class="form-control" placeholder="First name" aria-label="">
        </div>
        <div class="col-12">
            <label for="inputAddress2" class="form-label">Last name</label>
            <input type="text" class="form-control" placeholder="Last name" aria-label="">
        </div>
        <div class="col-md-6">
            <label for="inputEmail4" class="form-label">Email</label>
            <input type="email" class="form-control" id="inputEmail4">
        </div>
        <div class="col-md-6">
            <label for="inputPassword4" class="form-label">Password</label>
            <input type="password" class="form-control" id="inputPassword4">
        </div>
        <div class="col-12">
            <label for="inputAddress" class="form-label">Address</label>
            <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
        </div>
        <div class="row g-3">
            <div class="col-sm-7">
                <input type="text" class="form-control" placeholder="City" aria-label="City">
            </div>
            <div class="col-sm">
                <input type="text" class="form-control" placeholder="State" aria-label="State">
            </div>
            <div class="col-sm">
                <input type="text" class="form-control" placeholder="Zip" aria-label="Zip">
            </div>
        </div>
        <label for="range4" class="form-label">Example range</label>
        <input type="range" class="form-range" min="0" max="100" value="50" id="range4">
        <output for="range4" id="rangeValue" aria-hidden="true"></output>

        <script>
            // This is an example script, please modify as needed
            const rangeInput = document.getElementById('range4');
            const rangeOutput = document.getElementById('rangeValue');

            // Set initial value
            rangeOutput.textContent = rangeInput.value;

            rangeInput.addEventListener('input', function () {
                rangeOutput.textContent = this.value;
            });
        </script>
        <div class="mb-3">
            <input type="file" class="form-control" aria-label="file example" required>
            <div class="invalid-feedback">Example invalid form file feedback</div>
        </div>
        <p aria-hidden="true">
            <span class="placeholder col-6"></span>
        </p>

        <a class="btn btn-primary disabled placeholder col-4" aria-disabled="true"></a>
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                <label class="form-check-label" for="invalidCheck">
                    Agree to terms and conditions
                </label>
                <div class="invalid-feedback">
                    You must agree before submitting.
                </div>
            </div>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Submit form</button>
        </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
