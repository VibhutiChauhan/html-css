<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 2</title>
</head>
<style>
    body {
        margin: 3px;
        padding: 3px;
        color: black;
        font-size: x-large;

    }

    .con {
        width: 700px;
        height: 500px;
        background-color: rgb(241, 211, 173);
        border: 4px solid rgb(136, 131, 131);
        border-style: outset;
        position: relative;
    }

    header {
        width: 700px;
        color: white;
        height: 100px;
        text-align: center;
        line-height: 100px;
    }

    .logo {
        position: absolute;
        width: 100px;
        height: 100px;
        background-color: white;
        color: black;
        z-index: 10;
        display: flex;
        box-shadow: 10px 5px rgb(134, 133, 133);

    }

    .content {
        display: flex;
        height: 300px;
    }

    aside {
        width: 100px;
        height: 300px;
        display: flex;
        padding: 7px;
        border-right: 3px rgb(134, 133, 133);
    }

    .sub {
        width: 600px;
        height: 300px;
        background-color: rgb(216, 176, 123);
        padding: 20px;
        box-sizing: border-box;
    }

    .b1 {
        display: inline-block;
        background-color: rgb(241, 211, 173);
        border-radius: 15px;
        height: 127px;
        width: 177px;
        box-shadow: 0px 0px 10px 10px rgb(194, 190, 190);

    }

    footer {
        text-align: center;
        height: 100px;
        line-height: 100px;
        border-top: 3px solid rgb(134, 133, 133);
    }
</style>

<body>

    <div class="con">
        <div class="logo">Logo</div>
        <header>Header</header>
        <div class="content">
            <aside>Panel</aside>
            <div class="sub">
                <div class="b1"></div>
                <div class="b1"></div>
                <div class="b1"></div>
                <div class="b1"></div>
                <div class="b1"></div>
                <div class="b1"></div>

            </div>
        </div>
        <footer>Footer</footer>
    </div>

</body>

</html>
