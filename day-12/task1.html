<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

<style>
  body {
    justify-content: center;
    display: flex;
    margin: 50px;
  }

  .btn {
    padding: 12px 24px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 1s, transform 2s;
    /* TODO: add transition property */
  }

  .btn:hover {
    background-color: aquamarine;
    transform: scale(1, 2);
    /* TODO: change background-color and scale up slightly */
  }
</style>

<body>
  <button class="btn">Hover Me</button>
</body>
