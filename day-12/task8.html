<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 8</title>
</head>
<style>
    .flip-container {
        width: 200px;
        height: 260px;
        perspective: 1000px;
    }

    .flip-card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1s;
        /* TODO: transition transform */
    }

    .flip-container:hover .flip-card {
        transform: rotateY(180deg);
    }

    .front,
    .back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: black
    }

    .front {
        background: #3b82f6;
    }

    .back {
        background: #f97316;
        transform: rotateY(180deg);
        color: white;
    }
</style>

<body>
    <div class="flip-container">
        <div class="flip-card">
            <div class="front">Front</div>
            <div class="back">Back</div>
        </div>
    </div>
</body>

</html>
