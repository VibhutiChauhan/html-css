<style>
  .nav-link {
    position: relative;
    text-decoration: none;
    color: #111;
    font-size: 18px;
  }

  .nav-link::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 0%;
    height: 2px;
    background: #3b82f6;
    transition: width 0.3s;
  }

  .nav-link:hover::after {
    width: 100%;
  }
</style>

<body>

</body>
