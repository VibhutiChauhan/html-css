<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 10</title>
</head>
<style>
    .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: background-color 0.1s;
        /* TODO: transition background-color */
    }

    .backdrop.open {
        background: rgba(0, 0, 0, 0.5);
        pointer-events: auto;
    }

    .modal {
        background: white;
        padding: 24px;
        border-radius: 10px;
        opacity: 0;
        transform: scale(0.85);
        transition: transform 1s, opacity 0.1s;
        /* TODO: transition opacity and transform */
    }

    .backdrop.open .modal {
        opacity: 1;
        transform: scale(1);
    }
</style>


<body>
    <button onclick="document.querySelector('.backdrop').classList.toggle('open')">
        Open Modal
    </button>
    <div class="backdrop">
        <div class="modal">
            <h2>Hello!</h2>
            <p>This is an animated modal.</p>
        </div>
    </div>
</body>

</html>
