<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
</head>
<style>
    body {
        background-color: rgb(241, 241, 156);
    }

    table,
    th,
    tr,
    td {
        border: 1px solid white;
        border: none;
        border-collapse: collapse;
    }

    table {
        height: 300px;
        width: 300px;

    }

    .td {
        width: 100px;
        height: 100px;
    }

    .p1 {
        background-color: blueviolet;
        border-style: dotted;
        border-color: red;
    }

    .w1 {
        background-color: white;
    }

    .y1 {
        background-color: rgb(153, 130, 101);
    }

    .y2 {
        background-color: yellow;
    }

    .r1 {
        background-color: red;
    }

    .b1 {
        background-color: blue;
        border-style: dotted;
        border-color: white;
    }

    .g1 {
        background-color: gray;
        border-top-right-radius: 25px;
        border-bottom-left-radius: 25px;
    }
    .d8{
        background-color: rgb(179, 231, 214);
        height: 100px;
        position: relative;
        animation-name: animation;
        animation-duration: 7s;
        animation-delay: 1s;
        animation-direction: reverse;
    }
    @keyframes animation{
        0% {left: 0; top: 0;}
        25% {left: 0; top: -200px;}
        50% {left: 200px; top: -200px;}
        75% {left: 200px; top: 0;}
        100% {left: 0; top: 0;}
    }
</style>

<body>
    <table>
        <tr>
            <td>
                <div class="td p1">Div 1</div>
            </td>
            <td>
                <div class="td w1">Div 2
                    
                </div>
            </td>
            <td>
                <div class="td y1">Div 3</div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="td y2">Div 4</div>
            </td>
            <td>
                <div class="td r1">Div 5</div>
            </td>
            <td>
                <div class="td b1">Div 6</div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="td g1">Div 7</div>
            </td>
            <td>
                <div class="d8">Div 8</div>
            </td>
        </tr>
    </table>
</body>

</html>
