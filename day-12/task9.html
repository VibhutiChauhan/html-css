<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 9</title>
</head>
<style>
    li {
        list-style: none;
        padding: 10px;
        margin-bottom: 6px;
        background: #f3f4f6;
        border-radius: 6px;
        opacity: 0;
        transform: translateY(20px);
        animation: enter 0.5s ease-out forwards;
    }

    /* TODO: give each li a different animation-delay using nth-child */
    li:nth-child(1) {
        animation-delay: 0.1s;
    }

    li:nth-child(2) {
        animation-delay: 0.2s;
    }

    li:nth-child(3) {
        animation-delay: 0.3s;
    }

    li:nth-child(4) {
        animation-delay: 0.4s;
    }

    /* continue the pattern for more items, or use SCSS/JS to generate it */

    @keyframes enter {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<body>
    <ul>
        <li>Item One</li>
        <li>Item Two</li>
        <li>Item Three</li>
        <li>Item Four</li>
    </ul>
</body>

</html>
